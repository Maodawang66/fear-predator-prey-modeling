<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#0F2440"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563A0"/>
      <stop offset="100%" stop-color="#4A90B8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Decorative top-right circle -->
  <circle cx="1100" cy="150" r="300" fill="#2563A0" fill-opacity="0.08"/>
  <circle cx="1150" cy="120" r="200" fill="#4A90B8" fill-opacity="0.06"/>
  <!-- Decorative bottom-left element -->
  <rect x="0" y="620" width="400" height="4" fill="url(#accentLine)"/>
  <!-- Title -->
  <text x="640" y="260" text-anchor="middle" font-family="Georgia, 'Noto Serif CJK SC', SimSun, serif" font-size="56" font-weight="bold" fill="#FFFFFF">恐 惧 效 应 下 的</text>
  <text x="640" y="340" text-anchor="middle" font-family="Georgia, 'Noto Serif CJK SC', SimSun, serif" font-size="56" font-weight="bold" fill="#FFFFFF">捕食者 — 猎物动力学</text>
  <!-- Accent line under title -->
  <rect x="490" y="375" width="300" height="3" rx="1.5" fill="url(#accentLine)"/>
  <!-- Subtitle -->
  <text x="640" y="430" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#94A3B8">机 制 路 径 · 预 测 比 较 · 参 数 可 辨 识 性</text>
  <!-- Authors -->
  <text x="640" y="530" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" fill="#CBD5E1">贺小轩  ·  李松茂  ·  王玉麟</text>
  <!-- Institution -->
  <text x="640" y="565" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">USTC 数学建模课程 · 2026</text>
</svg>
