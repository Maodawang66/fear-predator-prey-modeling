    <text x="690" y="340" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#2563A0">04</text>
    <text x="750" y="340" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">参数可辨识性与结论</text>
    <text x="750" y="370" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#64748B">k profile · 跨系统 η · 预测改善 ≠ 机制识别</text>
