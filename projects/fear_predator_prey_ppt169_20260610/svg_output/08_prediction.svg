<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC"/>
  <!-- Header -->
  <rect x="60" y="40" width="4" height="36" fill="#1B3A5C" rx="2"/>
  <text x="76" y="66" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B3A5C">三模型预测比较</text>
  <text x="76" y="88" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8">Isle Royale 狼−驼鹿 (1959–2017) · 三模型拟合与留后验证并列</text>
  <line x1="60" y1="105" x2="1220" y2="105" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Three model fit images -->
  <g>
    <!-- Baseline -->
    <rect x="60" y="120" width="380" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="60" y="120" width="380" height="36" rx="8" fill="#1B3A5C"/>
    <rect x="60" y="136" width="380" height="20" fill="#1B3A5C"/>
    <text x="250" y="144" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Baseline (Holling II)</text>
    <image x="70" y="165" width="360" height="285" href="../images/12_isle_royale_wolf_moose_pre_2018_baseline.png" preserveAspectRatio="xMidYMid meet"/>

    <!-- Fear-Memory -->
    <rect x="450" y="120" width="380" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="450" y="120" width="380" height="36" rx="8" fill="#2563A0"/>
    <rect x="450" y="136" width="380" height="20" fill="#2563A0"/>
    <text x="640" y="144" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Fear-Memory (指数记忆核)</text>
    <image x="460" y="165" width="360" height="285" href="../images/12_isle_royale_wolf_moose_pre_2018_fear_memory.png" preserveAspectRatio="xMidYMid meet"/>

    <!-- B-D+Fear -->
    <rect x="840" y="120" width="380" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="840" y="120" width="380" height="36" rx="8" fill="#4A90B8"/>
    <rect x="840" y="136" width="380" height="20" fill="#4A90B8"/>
    <text x="1030" y="144" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">B-D + Fear (高灵活度)</text>
    <image x="850" y="165" width="360" height="285" href="../images/12_isle_royale_wolf_moose_pre_2018_bda_fear.png" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Bottom: Summary stats -->
  <g>
    <text x="80" y="500" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">15 条序列三模型比较汇总</text>

    <!-- Stat cards -->
    <rect x="80" y="520" width="270" height="85" rx="8" fill="#1B3A5C"/>
    <text x="215" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#FFFFFF">9/15</text>
    <text x="215" y="585" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#CBD5E1">B-D 留后验证单独最优</text>

    <rect x="370" y="520" width="270" height="85" rx="8" fill="#2563A0"/>
    <text x="505" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#FFFFFF">3/15</text>
    <text x="505" y="585" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#CBD5E1">Baseline 留后验证单独最优</text>

    <rect x="660" y="520" width="270" height="85" rx="8" fill="#4A90B8"/>
    <text x="795" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#FFFFFF">2/15</text>
    <text x="795" y="585" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#FFFFFF">Fear-Memory 留后最优</text>

    <rect x="950" y="520" width="270" height="85" rx="8" fill="#F0F3F7"/>
    <text x="1085" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#DC2626">1/15</text>
    <text x="1085" y="585" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">GLERL 三模型并列</text>
  </g>

  <!-- Key insight -->
  <rect x="80" y="625" width="1120" height="45" rx="6" fill="#FEF3C7"/>
  <text x="640" y="654" text-anchor="middle" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#92400E">留后验证 B-D 最优 · AICc Baseline 最优 13/15 · 预测能力与复杂度偏好不一致</text>

  <!-- Page number -->
  <text x="1220" y="690" text-anchor="end" font-family="'Noto Sans CJK SC', Arial, sans-serif" font-size="11" fill="#94A3B8">08 / 13</text>
</svg>
